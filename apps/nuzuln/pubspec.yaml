name: nuzuln
description: >
  تطبيق «نزلاً» للهاتف — الأستاذُ ووليُّ الأمر والطالب في تطبيقٍ واحد، يُحسم
  سطحُه من أدوار الحساب لحظةَ الدخول، فوق mousqe_core. والإدارةُ تبقى في
  admin_desktop.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  mousqe_core: ^0.1.0
  mousqe_ui: ^0.1.0
  drift: ^2.22.1
  dio: ^5.7.0
  uuid: ^4.5.1
  intl: ^0.20.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit: ^4.4.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
