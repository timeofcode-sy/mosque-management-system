name: mousqe_core
description: >
  طبقة البيانات المشتركة لتطبيقات موسقي الأربعة — نماذج الـ API، مخزن drift المحلي،
  عميل REST، ومحرّك المزامنة أوف-لاين.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.0
  dio: ^5.7.0
  retrofit: ^4.4.1
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^4.0.0
  json_serializable: ^6.9.0
  drift_dev: ^2.22.1
  retrofit_generator: ^10.2.0
  mocktail: ^1.0.4
