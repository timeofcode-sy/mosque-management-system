name: mousqe_ui
description: >
  الهوية البصرية المشتركة لتطبيقات نزلاً الأربعة — ثيم v3 (فاتح وليلي) فوق nuzul_ui،
  تعريب وRTL، ومكوّنات واجهة دنيا.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  nuzul_ui: ^1.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  # «حول التطبيق» يقرأ نسختَه، و«حول المطوِّر» يفتح البريدَ والهاتفَ والروابط.
  package_info_plus: ^8.3.1
  # التحديثُ من داخل التطبيق: يسأل الخادم، وينزّل الملفَّ ويتحقّق من بصمته، ثم يسلّمه للمثبّت.
  dio: ^5.7.0
  crypto: ^3.0.6
  path_provider: ^2.1.5
  mousqe_installer: ^0.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # الخطوط والأيقونات والشعار تأتي من حزمة nuzul_ui (هوية نزلاً v3)؛ وأصلُ هذه الحزمة
  # الوحيد شعارُ المطوِّر في «حول المطوِّر».
  uses-material-design: true
  assets:
    - assets/timeofcode_logo.png
