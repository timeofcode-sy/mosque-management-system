name: mousqe_ui
description: >
  الهوية البصرية المشتركة لتطبيقات نزلاً الأربعة — ثيم v3 (فاتح وليلي) فوق nuzul_ui،
  تعريب وRTL، ومكوّنات واجهة دنيا.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  nuzul_ui: ^1.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # الخطوط والأيقونات والشعار تأتي من حزمة nuzul_ui (هوية نزلاً v3) فلا أصول هنا.
  uses-material-design: true
