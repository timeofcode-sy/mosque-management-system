name: nuzul_ui
description: >-
  نزلاً (Nuzulan) design system for Flutter: theme, tokens, brand fonts, icons and widgets for the
  halaqa management apps on Android, iOS, Windows, macOS, Linux and the web.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

flutter:
  fonts:
    - family: ReemKufi
      fonts:
        - asset: fonts/ReemKufi-Regular.ttf
          weight: 400
        - asset: fonts/ReemKufi-SemiBold.ttf
          weight: 600
        - asset: fonts/ReemKufi-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: fonts/Amiri-Regular.ttf
          weight: 400
